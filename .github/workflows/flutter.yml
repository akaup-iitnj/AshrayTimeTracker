name: Flutter CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: flutter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-and-tests:
    name: Analyze, test, and build Android
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.6
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --coverage
      - run: dart run tool/check_coverage.dart 60
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v7
        with:
          name: android-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  windows:
    name: Smoke test and build Windows
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.6
          channel: stable
          cache: true
      - name: Ensure Visual C++ ATL is installed
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $installPath = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installPath) {
            throw 'Visual Studio C++ tools were not found on the runner.'
          }
          $atlPath = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.ATL -property installationPath
          if (-not $atlPath) {
            $setup = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\setup.exe'
            $arguments = 'modify --installPath "' + $installPath + '" --add Microsoft.VisualStudio.Component.VC.ATL --quiet --norestart'
            $process = Start-Process -FilePath $setup -ArgumentList $arguments -PassThru -Wait
            if ($process.ExitCode -notin @(0, 3010)) {
              throw "Visual Studio ATL installation failed with exit code $($process.ExitCode)."
            }
          }
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: flutter test integration_test -d windows
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v7
        with:
          name: windows-release
          path: build/windows/x64/runner/Release/**
          if-no-files-found: error
